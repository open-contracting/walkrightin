[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "walkrightin"
version = "0.0.1"
authors = [{name = "Open Contracting Partnership", email = "data@open-contracting.org"}]
description = "Find the files that public sources link to on Google Drive and other platforms, and check whether each opens anonymously"
readme = "README.rst"
license = {text = "BSD"}
urls = {Homepage = "https://github.com/open-contracting/walkrightin"}
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.11"
dependencies = [
    "antispam-link-shorteners",
    "click",
    "markdown-it-py",
    "requests",
    "urllib3>=2",
]

[project.optional-dependencies]
google-drive = [
    "google-auth",
]
test = [
    "coverage",
    "pytest",
]
wordpress = [
    "pymysql",
]

[project.scripts]
walkrightin = "walkrightin.cli:main"

[project.entry-points."walkrightin.sources"]
csv = "walkrightin.sources.csvfile:CSVSource"
files = "walkrightin.sources.files:FilesSource"
github = "walkrightin.sources.github:GitHubSource"
google_drive = "walkrightin.platforms.google_drive:GoogleDriveSource"
wordpress = "walkrightin.sources.wordpress:WordPressSource"

[project.entry-points."walkrightin.platforms"]
google_drive = "walkrightin.platforms.google_drive:GoogleDrive"

[tool.setuptools.packages.find]
exclude = [
    "tests",
    "tests.*",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "CPY001", "D203", "D212", "D415", "EM", "ISC001", "PLR091", "Q000",
    "D1",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["copyright"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["D100", "INP001"]
"walkrightin/platforms/__init__.py" = ["ARG002"]  # default hooks ignore their arguments
"tests/*" = [
    "ARG001", "D", "FBT003", "INP001", "PLR2004", "S", "TRY003",
    "ARG002",  # fakes have the signatures of what they replace
]
