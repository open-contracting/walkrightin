name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', pypy-3.11]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Windows skips the PDF tests.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y qpdf poppler-utils
      - if: matrix.os == 'macos-latest'
        run: brew install qpdf poppler
      - run: pip install .[test]
      - run: coverage run --source=walkrightin -m pytest -W error
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
  # Without `if: always()`, a failed `test` would skip `build`, and a skipped job satisfies a required status check.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
